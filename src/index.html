    /* L'ambre du theme clair donne 2,1:1 : correct pour une pastille ou un trait, pas
       pour du texte. La teinte decorative ne change pas ; le texte prend un ambre plus
       sombre de la meme famille, mesure a 5,2:1. Les sept autres themes passent deja. */
    .tm {
      --acc-text: var(--acc)
    }

    /* Mascotte : trente-deux feuilles de 32 px par frame, affichées à ×2, soit 64 px. Le pas
       d'un keyframe est lié à la taille d'affichage : à ×2 ce sont -768px et -1024px, et
       non les -1536px / -2048px de la spécification, calés sur ×4. */
    /* La mascotte ne sort jamais de sa piste : elle s'y place en absolu, et « left » vient
       du script. Cet élément ne porte aucune liaison « :style ». N'en ajoutez pas. Une
       liaison réécrit l'attribut entier dès qu'une de ses dépendances bouge : elle
       effacerait la position au moment même de la prise, quand « dragging » bascule. C'est
       le piège de « className », un cran plus haut. Une part variable passe donc par un
       attribut de données et une règle. */
    .slime {
      position: absolute;
      bottom: 0;
      width: 64px;
      height: 64px;
      background-repeat: no-repeat;
      background-position: 0 0;
      image-rendering: pixelated;
      touch-action: none;
      cursor: grab
    }

    .slime[data-held="true"] {
      cursor: grabbing
    }

    .slime[data-gone="true"] {
      pointer-events: none
    }

    /* Le défilement ne touche qu'un axe. L'autre reste libre : la construction fusionne
       les trente-deux feuilles en une seule image, où il désigne l'état. */
    @keyframes slime-8 {
      to {
        background-position-x: -512px
      }
    }

    @keyframes slime-12 {
      to {
        background-position-x: -768px
      }
    }

    @keyframes slime-16 {
      to {
        background-position-x: -1024px
      }
    }

    @keyframes slime-20 {
      to {
        background-position-x: -1280px
      }
    }

    @keyframes slime-24 {
      to {
        background-position-x: -1536px
      }
    }

    /* Une animation qui tient sa dernière case a besoin d'un pas différent. « steps(n) »
       finit sa course sur la case n + 1, qui n'existe pas : la mascotte disparaissait sous
       la main qui la retenait. « jump-none » répartit n valeurs de la première case à la
       dernière incluse, donc le keyframe s'arrête une case plus tôt. */
    @keyframes slime-12-hold {
      to {
        background-position-x: -704px
      }
    }

    @keyframes slime-16-hold {
      to {
        background-position-x: -960px
      }
    }

    @keyframes slime-24-hold {
      to {
        background-position-x: -1472px
      }
    }

    /* Une feuille par état, dans l'ordre où la construction les empile. Elle remplace
       chaque image par la bande correspondante de la feuille fusionnée : cet ordre est
       donc le seul qui existe, et le CSS ne peut pas se décaler par rapport à l'image.
       Servi tel quel, sans construction, src/ tire une feuille par état déclenché. */
    .slime--idle {
      background-image: url("assets/sprites/slime-idle.png");
      background-size: 768px 64px;
      animation: slime-12 1.44s steps(12) infinite
    }

    .slime--type {
      background-image: url("assets/sprites/slime-type-b.png");
      background-size: 768px 64px;
      animation: slime-12 .72s steps(12) infinite
    }

    .slime--load {
      background-image: url("assets/sprites/slime-load.png");
      background-size: 1024px 64px;
      animation: slime-16 1.6s steps(16) infinite
    }

    .slime--sleep {
      background-image: url("assets/sprites/slime-sleep.png");
      background-size: 1024px 64px;
      animation: slime-16 3.2s steps(16) infinite
    }

    .slime--wink {
      background-image: url("assets/sprites/slime-wink.png");
      background-size: 768px 64px;
      animation: slime-12 1.68s steps(12) 1
    }

    .slime--jump {
      background-image: url("assets/sprites/slime-jump.png");
      background-size: 1024px 64px;
      animation: slime-16 1.28s steps(16) 1
    }

    /* La mue est la transition entre deux teintes : elle part de l'ancienne et arrive sur
       la nouvelle, au lieu de sauter au premier instant. Le fondu tient la passe, et lui
       seul : un changement de thème sans mue garde sa teinte immédiate. */
    .slime--morph {
      background-image: url("assets/sprites/slime-morph.png");
      background-size: 1024px 64px;
      animation: slime-16 2.4s steps(16) 1;
      transition: filter 2.4s linear
    }

    /* L'explosion s'arrête sur sa dernière frame : le slime reste absent le temps que
       le minuteur lui rende sa forme. */
    .slime--boom {
      background-image: url("assets/sprites/slime-boom.png");
      background-size: 1024px 64px;
      animation: slime-16-hold 1.12s steps(16, jump-none) 1 forwards
    }

    .slime--reform {
      background-image: url("assets/sprites/slime-reform.png");
      background-size: 1024px 64px;
      animation: slime-16 1.6s steps(16) 1
    }

    /* Expressions de commande. Elles répondent à une action, pas à un survol : elles
       peuvent durer, et elles portent de vraies phases plutôt qu'une simple boucle.
       « laugh », « sad » et « scared » bouclent : leur seule sortie est le minuteur du
       script, une animation infinie n'émettant jamais « animationend ». */
    .slime--alert {
      background-image: url("assets/sprites/slime-alert.png");
      background-size: 1024px 64px;
      animation: slime-16 .96s steps(16) 1
    }

    .slime--happy {

      background-size: 1280px 64px;

    }

    .slime--laugh {

    .slime--sad {

    }

    .slime--scared {

    }

    .slime--drop {
      background-image: url("assets/sprites/slime-drop.png");
      background-size: 1536px 64px;
      animation: slime-24 1.44s steps(24) 1
    }

    /* Activités. Une expression se lit sur le visage, une activité demande un accessoire :
       le corps rétrécit pour lui faire de la place. « bike » et « juggle » bouclent, et le
       minuteur du script est leur seule sortie. */
    .slime--goal {
      background-image: url("assets/sprites/slime-goal.png");
      background-size: 1536px 64px;
      animation: slime-24 1.44s steps(24) 1
    }

    .slime--bike {

    }

    .slime--coffee {

    .slime--lift {

    }

    .slime--juggle {

    }

    /* Le train part avec la mascotte et laisse le quai vide. Sa dernière case doit tenir,
       comme celle de l'explosion : le script la ramène ensuite par « drop ». */
    .slime--train {
      background-image: url("assets/sprites/slime-train.png");
      background-size: 1536px 64px;
      animation: slime-24-hold 1.44s steps(24, jump-none) 1 forwards
    }

    /* Manipulation à la souris. « attrapé » et les deux déplacements bouclent tant que le
       bouton reste enfoncé. Les huit plaquages tiennent leur dernière case : la mascotte
       reste écrasée tant qu'elle est plaquée contre la paroi. */
    .slime--grab {
      background-image: url("assets/sprites/slime-grab.png");
      background-size: 768px 64px;
      animation: slime-12 1.2s steps(12) infinite
    }

    .slime--dragRight {
      background-image: url("assets/sprites/slime-drag-right.png");

      animation: slime-8 .4s steps(8) infinite
    }

    }

    .slime--splatRight {

    /* Un coin n'est pas la somme de deux plaquages : la matière n'a plus qu'une direction
       pour s'échapper, la diagonale. Le dessin le rend, le script les teste avant les
       murs. */
    .slime--splatCeilingLeft {

    .slime--splatFloorRight {

    /* Les couleurs sont cuites dans les PNG. Les thèmes sombres les font tourner ;
       l'ambre des feuilles mesure 40°, celui du thème dark aussi, donc rien à tourner.
       Les trois thèmes clairs gardent la palette ambre. */
    .tm[data-theme="noctis"] .slime {
      filter: hue-rotate(117deg)
    }

    .tm[data-theme="azureus"] .slime {
      filter: hue-rotate(163deg)
    }

    .tm[data-theme="uva"] .slime {
      filter: hue-rotate(205deg)
    }

    .tm[data-theme="bordo"] .slime {
      filter: hue-rotate(306deg)
    }

    /* Un seul rayon pour les six zones : les deux cartes du volet gauche, le volet
       central, le volet de sortie, la modale et le cadre de démarrage. La valeur s'essaie
       dans le navigateur sans chasser six déclarations.
       Une zone porte le rayon et ne prend jamais le focus. Un élément intérieur reste à
       angle droit : un outline suit le rayon de l'élément qu'il entoure, et l'état
       sélectionné d'un bouton s'arrondissait là où l'entrée de frise restait carrée.
       Une seule exception : le point du bandeau, qui est un cercle et non un coin. */
    .tm {
      --radius: 5px
    }

    .tm[data-theme="light"] {
      --acc-text: #8f5f00
    }

    /* La feuille du canvas colore les liens avec l'ambre decoratif. Un lien est du
       texte : il prend l'ambre textuel. */
    .tm a,
    .tm a:hover {
      color: var(--acc-text)
    }

    .tm a:hover {
      border-bottom-color: var(--acc-text)
    }

    /* Le canvas exprimait le survol et le focus en attributs style-hover et style-focus,
       que son runtime synthétisait. Un navigateur ne sait pas les mettre en inline : ces
       règles sont la seule chose qui sorte des styles inline. */
    /* La mascotte est visqueuse : sa partie haute se deforme quand on la deplace. La
       couronne est un objet solide et garde sa forme, d'ou l'animation portee par le
       bloc et non par la couronne. */

    .tm [data-ctl]:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px
    }

    .tm [data-ctl="opts"]:hover {
      color: var(--acc);
      border-color: var(--acc)
    }

    .tm [data-ctl="retry"]:hover {
      background: var(--acc-soft)
    }

    .tm [data-ctl="retry"]:focus-visible {
      outline-width: 3px
    }

    /* Sous 900 px les trois volets s'empilent en une colonne. Une requête de média ne
       peut pas s'écrire en style inline : c'est la seconde chose, avec le survol et le
       focus, qui sort des styles inline. Mais un style inline bat une feuille de style :
       la requête pose donc des jetons, et chaque déclaration reste en ligne, avec sa
       valeur de bureau en repli. Le volet central porte la réponse que le visiteur
       cherche : il passe en tête et prend la plus grande part. L'ordre du document ne
       bouge pas, donc le parcours clavier non plus. Le journal perd son plafond : la
       colonne défile déjà, donc une réponse longue n'a plus à tenir dans 120 px. */
    @media (max-width: 900px) {
      .tm {
        --panes-overflow: hidden auto;
        --pane-flex: none;
        --pane-min: 42dvh;
        --log-height: auto;
        --log-overflow: visible
      }

      .tm [data-panes] {
        flex-direction: column
      }

      .tm [data-pane="main"] {
        --pane-min: 70dvh;
        order: -1
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="texte.html">Aller à la version texte, plus simple avec un lecteur
    d'écran.</a>
  <div class="tm" x-data="terminal" :data-theme="theme" x-cloak @keydown.window="onKey($event)"
    style="background:var(--bg);color:var(--fg);height:100dvh;max-height:100dvh;overflow:hidden;box-sizing:border-box;padding:14px clamp(12px,2.5vw,26px) 14px;font-size:14px;line-height:1.6;position:relative;display:flex;flex-direction:column;gap:10px">

    <div data-panes
      :style="`flex:1;min-height:0;display:flex;flex-wrap:nowrap;gap:10px;align-items:stretch;overflow:var(--panes-overflow,hidden);max-width:2400px;width:100%;margin:0;animation:${power === 'fade' && anim ? 'revealUp .62s cubic-bezier(.2,.7,.3,1) both' : 'none'}`">

      <nav data-pane="nav" aria-label="Sections"
        style="flex:var(--pane-flex,0 1 clamp(196px,17vw,280px));min-width:176px;min-height:var(--pane-min,0px);display:flex;flex-direction:column;gap:10px;overflow:hidden">
        <button type="button" data-ctl="opts" aria-haspopup="dialog"
          :aria-expanded="optsOpen ? 'true' : 'false'" @click="openOpts()"
          style="flex:none;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--edge);background:var(--panel);color:var(--fg2);font-family:inherit;font-size:11px;letter-spacing:.12em;cursor:pointer"><span>options</span><span
            aria-hidden="true" style="font-size:17px;line-height:1">⚙</span></button>
        <div
          style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden">
          <div style="flex:none;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);overflow:hidden">
            <p
              style="margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;color:var(--fg2);border-bottom:1px solid var(--edge)">
              sections</p>
            <ul style="list-style:none;margin:0;padding:5px;display:grid;gap:1px">
              <template x-for="item in sections" :key="item.id">
                <li>
                  <button type="button" data-ctl="nav" :aria-current="item.id === section ? 'true' : 'false'"
                    @click="goSection(item.id)"
                    :style="`width:100%;min-height:44px;display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:center;text-align:left;padding:5px 8px;border:0;border-left:2px solid ${item.id === section ? 'var(--acc)' : 'transparent'};background:${item.id === section ? 'var(--acc-soft)' : 'transparent'};color:var(--fg);font-family:inherit;font-size:14px;cursor:pointer`">
                    <span aria-hidden="true"
                      :style="`width:8px;height:8px;background:var(--${item.dot});animation:${item.dot === 'acc' && anim ? 'dotPulse 1.2s ease-in-out infinite' : 'none'}`"></span>
                    <span style="display:grid;gap:1px;min-width:0">
                      <span :style="`font-weight:${item.id === section ? '700' : '400'}`" x-text="item.label"></span>
                      <span
                        :style="`font-size:12px;color:var(--${item.id === section ? 'fg' : 'fg2'});overflow-wrap:anywhere`"
                        x-text="item.sub"></span>
                    </span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
          <div style="flex:none;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);overflow:hidden">
            <p
              style="margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;color:var(--fg2);border-bottom:1px solid var(--edge)">
              missions</p>
            <ul style="list-style:none;margin:0;padding:5px;display:grid;gap:1px">
              <template x-for="item in missions" :key="item.id">
                <li>
                  <button type="button" data-ctl="nav" :aria-current="item.id === section ? 'true' : 'false'"
                    @click="goSection(item.id)"
                    :style="`width:100%;min-height:44px;display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:center;text-align:left;padding:5px 8px;border:0;border-left:2px solid ${item.id === section ? 'var(--acc)' : 'transparent'};background:${item.id === section ? 'var(--acc-soft)' : 'transparent'};color:var(--fg);font-family:inherit;font-size:14px;cursor:pointer`">
                    <span aria-hidden="true"
                      :style="`width:8px;height:8px;background:var(--${item.dot});animation:${item.dot === 'acc' && anim ? 'dotPulse 1.2s ease-in-out infinite' : 'none'}`"></span>
                    <span style="display:grid;gap:1px;min-width:0">
                      <span :style="`font-weight:${item.id === section ? '700' : '400'}`"
                        x-text="item.label"></span>
                      <span
                        style="font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                        x-text="item.state"></span>
                    </span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </nav>

      <section data-pane="main" aria-label="Session"
        style="position:relative;flex:var(--pane-flex,3 1 360px);min-width:0;min-height:var(--pane-min,0px);display:flex;flex-direction:column;gap:10px;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);padding:14px;overflow:hidden">
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.5">
          <div
            :style="`height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.16;animation:${anim ? 'scan 9s linear infinite' : 'none'}`">
          </div>
        </div>
        <p style="margin:0;font-size:13px;color:var(--fg2);flex:none"><span
            aria-hidden="true" style="color:var(--acc-text)">›&nbsp;</span><span
            style="color:var(--fg)" x-text="typed"></span><span
            x-show="!running && anim" aria-hidden="true"
            :style="`color:var(--acc-text);animation:${anim ? 'caret 1s steps(1) infinite' : 'none'}`">_</span></p>
        <template x-if="running">
          <p data-running
            style="flex:none;margin:0;color:var(--fg2);display:flex;align-items:center;gap:10px;font-size:13px"><span
              aria-hidden="true"
              :style="`color:var(--acc);animation:${anim ? 'dotPulse 1s ease-in-out infinite' : 'none'}`">▚</span><span
              :style="`animation:${anim ? 'dotPulse 1.2s ease-in-out infinite' : 'none'}`">exécution…</span></p>
        </template>
        <div data-result
          :style="`flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;display:grid;gap:2px;line-height:1.6;visibility:${running ? 'hidden' : 'visible'}`">

          <template x-if="current.view === 'timeline'">
            <div data-timeline role="listbox" aria-label="Parcours professionnel" aria-orientation="vertical"
              style="display:grid;gap:2px;align-content:start">
              <template x-for="(entry, index) in timeline" :key="entry.id">
                <button type="button" role="option" data-ctl="tl" :aria-selected="index === timelineAt"
                  @click="openTimeline(index)" @focus="timelineAt = index"
                  :style="`display:grid;grid-template-columns:14px 14px 1fr;gap:8px;text-align:left;padding:6px 8px;border:0;border-left:2px solid ${index === timelineAt ? 'var(--acc)' : 'transparent'};background:${index === timelineAt ? 'var(--acc-soft)' : 'transparent'};color:var(--fg);font-family:inherit;font-size:13px;cursor:pointer`">
                  <span aria-hidden="true" style="color:var(--acc-text)"
                    x-text="index === timelineAt ? '›' : ' '"></span>
                  <span data-guide aria-hidden="true"
                    :style="`color:var(--${index === timelineAt ? 'acc-text' : 'fg2'})`"
                    x-text="index === timeline.length - 1 ? '└' : '├'"></span>
                  <span style="display:grid;gap:2px;min-width:0">
                    <span data-years style="font-variant-numeric:tabular-nums;color:var(--fg2);font-size:12px"
                      x-text="entry.years"></span>
                    <span :style="`font-weight:${index === timelineAt ? '700' : '400'}`" x-text="entry.org"></span>
                    <span style="font-size:12px;color:var(--fg2);text-wrap:pretty" x-text="entry.role"></span>
                    <span data-cue :style="`font-size:12px;color:var(--${entry.detail ? 'acc-text' : 'fg2'})`"
                      x-text="missionCue(entry)"></span>
                  </span>
                </button>
              </template>
            </div>
          </template>

          <template x-if="current.view === 'tree'">
            <div data-tree style="display:grid;gap:2px;align-content:start;font-size:13px">
              <p style="margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
                <span style="font-weight:700">benjamin-david</span>
                <span style="color:var(--fg2);font-size:12px" x-text="stackSummary"></span>
              </p>

              <template x-for="(root, branch) in stack" :key="root.id">
                <div style="display:grid;grid-template-columns:26px 1fr">
                  <div aria-hidden="true"
                    :style="`position:relative;display:flex;justify-content:center;border-left:1px solid ${branch === stack.length - 1 ? 'transparent' : 'var(--edge)'};margin-left:4px`">
                    <span style="position:absolute;top:9px;left:-1px;width:14px;border-top:1px solid var(--edge)"></span>
                  </div>
                  <div style="padding:0 0 18px 6px;display:grid;gap:9px">
                    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
                      <span style="font-weight:700;color:var(--acc-text);font-size:15px" x-text="root.label"></span>
                      <span style="font-size:12px;color:var(--fg2)" x-text="root.note"></span>
                      <span style="font-size:11px;color:var(--fg2);border:1px solid var(--edge);padding:1px 9px"
                        x-text="`${root.kids.length}`"></span>
                    </div>

                    <!-- Les technologies coulent en colonnes, comme la sortie d'un ls. -->
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px 18px">
                      <template x-for="(kid, at) in root.kids" :key="kid">
                        <button type="button" data-ctl="tech" data-tech :aria-pressed="tech === kid"
                          @click="followTech(kid)" @focus="followTech(kid)"
                          :style="`display:grid;grid-template-columns:12px 1fr;gap:7px;align-items:baseline;text-align:left;padding:1px 4px 1px 0;border:0;background:transparent;color:var(--${tech === kid ? 'acc-text' : 'fg'});font-family:inherit;font-size:13px;font-weight:${tech === kid ? '700' : '400'};cursor:pointer`"><span
                            data-guide aria-hidden="true" style="color:var(--fg2)"
                            x-text="at === root.kids.length - 1 ? '└' : '├'"></span><span x-text="kid"></span></button>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-for="(line, index) in current.lines" :key="`${section}-${index}`">
            <p
              :style="`margin:0;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:baseline;padding-left:${line.pad ?? '0'}`">
              <span aria-hidden="true" :style="`color:var(--${line.markerTone ?? 'fg2'})`"
                x-text="line.marker ?? ''"></span>
              <span
                :style="`color:var(--${(line.tone ?? 'fg') === 'acc' ? 'acc-text' : (line.tone ?? 'fg')});font-size:${line.size ?? '14px'};font-weight:${line.weight ?? '400'};letter-spacing:${line.letterSpacing ?? '0'};text-wrap:pretty`">
                <template x-if="line.banner">
                  <span role="img" :aria-label="line.banner.label"
                    style="margin-bottom:12px"
                    :style="`display:block;position:relative;width:${line.banner.width};height:${line.banner.height};max-width:100%`"><span
                      aria-hidden="true"
                      :style="`position:absolute;top:0;left:0;width:${line.banner.size};height:${line.banner.size};border-radius:50%;box-shadow:${line.banner.shadow}`"></span></span>
                </template>
                <template x-if="!line.banner && line.tokens">
                  <span><template x-for="(tk, at) in line.tokens" :key="at"><span
                        :style="`color:var(--${tk.c === 'acc' ? 'acc-text' : tk.c});font-weight:${tk.w}`" x-text="tk.t"></span></template></span>
                </template>
                <template x-if="!line.banner && !line.tokens">
                  <span x-text="line.text"></span>
                </template>
              </span>
            </p>
          </template>
        </div>

        <div data-handle x-show="journalOverflows" role="separator" aria-orientation="horizontal"
          aria-label="Redimensionner le journal" tabindex="0" :aria-valuenow="logHeight"
          aria-valuemin="44" :aria-valuemax="600" @pointerdown.prevent="logDown($event)"
          @keydown.arrow-up.prevent="setLogHeight(logHeight + 24)"
          @keydown.arrow-down.prevent="setLogHeight(logHeight - 24)"
          style="flex:none;display:flex;justify-content:center;align-items:center;height:14px;cursor:row-resize;color:var(--fg2);font-size:12px;letter-spacing:.3em;user-select:none">⋯</div>

        <div data-journal x-ref="journal" aria-live="polite" tabindex="0" role="log"
          aria-label="Journal" @scroll="checkMore('journal')"
          :style="`flex:none;height:var(--log-height,${logHeight}px);overflow-y:var(--log-overflow,auto);align-content:start;display:grid;gap:2px;border-top:1px solid var(--edge);padding-top:8px`">
          <template x-for="(entry, index) in journal" :key="index">
            <p
              style="margin:0;display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:baseline;line-height:1.5">
              <span aria-hidden="true" :style="`color:var(--${entry.mc === 'acc' ? 'acc-text' : entry.mc})`" x-text="entry.m"></span>
              <span :style="`color:var(--${entry.c === 'acc' ? 'acc-text' : entry.c});white-space:pre-wrap;overflow-wrap:anywhere`"
                x-text="entry.t"></span>
            </p>
          </template>
        </div>

        <template x-if="more.journal">
          <p data-more aria-hidden="true"
            style="flex:none;margin:0;text-align:right;font-size:11px;letter-spacing:.1em;color:var(--fg2)">▾ plus bas
          </p>
        </template>


        <div data-track x-ref="track"
          @pointermove="nearby($event)"
          @pointermove.window="logMove($event)" @pointerup.window="logUp()"
          @pointercancel.window="logUp()"
          style="flex:none;position:relative;height:64px;overflow:visible;border-bottom:1px solid var(--edge)">
          <template x-if="bubble">
            <span data-bubble aria-live="polite"
              :style="`position:absolute;bottom:52px;left:${at}px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);padding:2px 8px;font-size:12px;white-space:nowrap;pointer-events:none;animation:${anim ? 'lineIn .24s ease both' : 'none'}`"
              x-text="bubble"></span>
          </template>

          <!-- Animations coupées ou mouvement réduit : la mascotte ne s'affiche pas du tout,
               et aucune feuille ne part sur le réseau. La piste garde sa place, vide. Elle
               est décorative : elle sort du parcours clavier et du nom accessible.
               « .self » écarte les animations de décor, qui remontent jusqu'ici et
               rendraient la main au repos au milieu d'une boucle.
               La capture du pointeur porte tout le plaquage : l'état se lit sur un curseur
               sorti de la piste, et sans capture le navigateur cesserait de livrer
               « pointermove » dès la sortie. Ne la retirez pas. -->
          <template x-if="anim && !reduced">
            <div data-mascot x-ref="mascot" aria-hidden="true" class="slime"
              :data-held="dragging" :data-gone="gone"
              x-init="$nextTick(() => { place(at); settle() })" @pointerdown.prevent="grab($event)"
              @pointermove="drag($event)" @pointerup="release()" @pointercancel="release()"
              @click="poke()" @animationend.self="settle()">
              <template x-if="motion === 'bump' && anim">
                <span data-bang aria-hidden="true"
                  style="position:absolute;left:50%;top:-20px;transform:translateX(-50%);color:var(--warn);font-size:19px;font-weight:700;animation:bang .4s cubic-bezier(.34,1.6,.64,1) both">!</span>
              </template>
            </div>
          </template>

          <template x-if="motion === 'bump' && anim">
            <span data-spark aria-hidden="true"
              :style="`position:absolute;bottom:14px;${direction > 0 ? 'right:2px' : 'left:2px'};color:var(--warn);font-size:15px;animation:spark .6s ease-out both`">✳</span>
          </template>
        </div>


        <div x-show="suggOpen" x-transition:enter.duration.220ms x-transition:leave.duration.170ms
          data-suggestions role="listbox" aria-label="Suggestions"
          style="flex:none;display:grid;gap:1px;border:1px solid var(--edge);background:var(--panel);padding:4px;margin-bottom:-4px">
          <template x-for="(hit, index) in sugg" :key="hit">
            <button type="button" data-suggestion role="option" :aria-selected="index === suggAt"
              @pointerdown.prevent="pickSugg(index, $event)"
              :style="`min-height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border:0;border-left:2px solid ${index === suggAt ? 'var(--acc)' : 'transparent'};background:${index === suggAt ? 'var(--acc-soft)' : 'transparent'};color:var(--fg);font-family:inherit;font-size:13px;text-align:left;cursor:pointer;animation:${anim ? `suggRow .2s ease ${(index * 0.024).toFixed(3)}s both` : 'none'}`"><span
                style="color:var(--acc-text)" x-text="suggFrag"></span><span style="margin-left:-8px"
                x-text="hit.slice(suggFrag.length)"></span></button>
          </template>
        </div>

        <form data-cli @submit.prevent="submit()"
          style="flex:none;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;margin-top:-10px;padding-top:6px">
          <label for="cli" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Commande</label>
          <span aria-hidden="true" style="color:var(--acc-text)">›</span>
          <input id="cli" x-ref="cli" x-model="input" @input="suggest(); typing()"
            @blur="closeSugg()"
            @keydown.tab.prevent="complete()" @keydown.arrow-up.prevent="up()"
            @keydown.arrow-down.prevent="down()" @keydown.arrow-right="right($event)"
            @keydown.escape.prevent="onEscape()" type="text"
            autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="help"
            style="min-width:0;border:0;background:transparent;color:var(--fg);font-family:inherit;font-size:14px;outline:none">
        </form>
        <p data-status
          style="flex:none;margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:var(--fg2);padding-top:6px">
          <span data-branch style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span
              x-text="`~/${section}`"></span> <span style="color:var(--acc-text)">main</span> ✳ </span>
          <!-- Pendant la compaction, l'animation prend la place des cellules : le cadre
               « ctx [ … ] » ne bouge pas, et une seule barre reste a l'ecran. -->
          <span data-gauge aria-hidden="true" style="flex:none;white-space:pre"><span
              style="color:var(--fg2)">ctx [</span><template x-if="!compacting"><span><span
                  :style="`color:var(--${ctxCells === 10 ? 'warn' : 'acc-text'})`"
                  x-text="'█'.repeat(ctxCells)"></span><span style="color:var(--edge)"
                  x-text="'░'.repeat(10 - ctxCells)"></span></span></template><template
              x-if="compacting"><span data-compacting><span style="color:var(--warn)"
                  x-text="compactBar.filled"></span><span style="color:var(--edge)"
                  x-text="compactBar.hollow"></span></span></template><span
              style="color:var(--fg2)" x-text="`] ${ctxPct}`"></span></span>
        </p>
      </section>

      <!-- Les deux bases viennent de la maquette. Elles vont par paire : donner sa base
           au volet de sortie sans rendre la sienne au volet central inverserait les deux,
           le droit prenant 641 px contre 346 px a gauche. Fixes, elles gardent la mise en
           page identique d'une section a l'autre. -->
      <aside data-pane="out" aria-label="Sortie" x-show="out"
        style="flex:var(--pane-flex,1.3 1 230px);min-width:0;min-height:var(--pane-min,0px);display:flex;flex-direction:column;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);overflow:hidden">
        <p
          style="margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;color:var(--fg2);border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;gap:10px">
          <span x-text="current.out.title"></span><span
            :style="`color:var(--${running ? 'warn' : 'ok'})`"><span data-outdot aria-hidden="true"
              :style="`animation:${anim ? 'dotPulse 1.2s ease-in-out infinite' : 'none'}`">●</span> <span
              x-text="outStatus"></span></span>
        </p>
        <div tabindex="0" role="region" aria-label="Contenu de la sortie"
          style="overflow-y:auto;align-content:start;display:grid;gap:8px;padding:10px 12px">
          <template x-if="running">
            <p data-waiting
              style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;color:var(--fg2)"><span
                aria-hidden="true"
                :style="`color:var(--acc);animation:${anim ? 'dotPulse 1s ease-in-out infinite' : 'none'}`">▚</span><span
                :style="`animation:${anim ? 'dotPulse 1.2s ease-in-out infinite' : 'none'}`">en attente de la sortie…</span>
            </p>
          </template>
          <dl x-show="!running" style="margin:0;display:grid;gap:6px;align-content:start;font-size:13px">
            <template x-for="(row, index) in current.out.lines" :key="index">
              <!-- La colonne des cles prend la largeur de la plus longue de la section :
                   les valeurs restent alignees sans que la moitie du volet reste vide. -->
              <div :style="`display:grid;grid-template-columns:${outKeyWidth} minmax(0,1fr);gap:10px`">
                <dt :style="`color:var(--${row.kc === 'acc' ? 'acc-text' : row.kc});margin:0`" x-text="row.k"></dt>
                <dd :style="`color:var(--${row.vc === 'acc' ? 'acc-text' : row.vc});margin:0;overflow-wrap:anywhere;text-wrap:pretty`"
                  x-text="row.v"></dd>
              </div>
            </template>
          </dl>

          <template x-if="techNote">
            <div data-technote
              :style="`border-top:1px solid var(--edge);padding-top:8px;display:grid;gap:4px;animation:${anim ? 'lineIn .26s ease both' : 'none'}`">
              <p style="margin:0;color:var(--acc-text);font-weight:700" x-text="tech"></p>
              <p style="margin:0;color:var(--fg2);font-size:12px" x-text="techNote.where"></p>
              <p style="margin:0;text-wrap:pretty" x-text="techNote.note"></p>
            </div>
          </template>
        </div>
      </aside>
    </div>

    <template x-if="optsOpen">
      <div @click="closeOpts()"
        style="position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(10,10,18,.62);animation:fadeIn .16s ease both">
        <div role="dialog" aria-modal="true" aria-label="Options d'affichage" data-opts
          @click.stop @keydown="optsKey($event)"
          style="width:min(540px,100%);max-height:min(88dvh,620px);overflow:auto;box-sizing:border-box;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);padding:18px;display:grid;gap:14px;animation:popIn .24s cubic-bezier(.34,1.4,.64,1) both">
          <p style="margin:0;font-size:12px;letter-spacing:.12em;color:var(--fg2)">options</p>

          <div style="display:grid;gap:8px">
            <div style="display:flex;justify-content:space-between;gap:12px">
              <p style="margin:0;font-size:13px">thème</p>
              <p style="margin:0;font-size:13px;color:var(--acc-text)" x-text="themeLabel"></p>
            </div>
            <div role="group" aria-label="Thème"
              style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px">
              <template x-for="entry in THEMES" :key="entry.id">
                <button type="button" data-ctl="opt" :data-theme-choice="entry.id"
                  :aria-pressed="entry.id === theme"
                  @click="setTheme(entry.id, $event)"
                  :style="`min-height:44px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid ${entry.id === theme ? 'var(--acc)' : 'var(--edge)'};background:${entry.id === theme ? 'var(--acc-soft)' : 'transparent'};color:var(--fg);font-family:inherit;font-size:13px;cursor:pointer;text-align:left`">
                  <span aria-hidden="true"
                    :style="`width:18px;height:18px;flex:none;border:1px solid ${entry.edge};background:${entry.bg};position:relative;overflow:hidden`"><span
                      :style="`position:absolute;inset:auto 0 0 0;height:7px;background:${entry.acc}`"></span></span>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="entry.label"></span>
                </button>
              </template>
            </div>
          </div>

          <div role="group" aria-label="Affichage" style="display:grid;gap:6px">
            <template x-for="toggle in TOGGLES" :key="toggle.key">
              <button type="button" data-ctl="opt" data-toggle :aria-pressed="value(toggle.key)"
                @click="flip(toggle.key)"
                :style="`width:100%;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 12px;border:1px solid var(--edge);border-left:2px solid ${value(toggle.key) ? 'var(--ok)' : 'var(--fg2)'};background:transparent;color:var(--fg);font-family:inherit;font-size:13px;cursor:pointer`"><span
                  x-text="toggle.label"></span><span
                  :style="`color:${value(toggle.key) ? 'var(--ok)' : 'var(--fg2)'}`"
                  x-text="value(toggle.key) ? toggle.on : toggle.off"></span></button>
            </template>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">
            <p style="margin:0;font-size:12px;color:var(--fg2);max-width:40ch;line-height:1.5;text-wrap:pretty"><span
                style="color:var(--acc-text)">← →</span> value · <span style="color:var(--acc-text)">↑ ↓</span> setting
              · <span style="color:var(--acc-text)">esc</span> close · kept on this device</p>
            <button type="button" data-ctl="opt" @click="closeOpts()"
              style="min-height:44px;padding:0 18px;border:1px solid var(--edge);background:transparent;color:var(--fg);font-family:inherit;font-size:13px;cursor:pointer">close</button>
          </div>
        </div>
      </div>
    </template>

    <template x-if="booting">
      <div data-boot
        :style="`position:absolute;inset:0;z-index:30;background:var(--bg);padding:18px clamp(12px,2.5vw,26px) 26px;box-sizing:border-box;display:flex;flex-direction:column;${power === 'fade' ? 'animation:bootOut .62s ease forwards' : ''}`">
        <div
          style="flex:1;border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);padding:clamp(20px,4vw,44px);display:grid;align-content:center;gap:8px;font-size:13px;line-height:1.7">
          <template x-if="dataErr">
            <div role="alert" style="display:grid;gap:8px">
              <p style="margin:0;color:var(--warn);font-size:16px;font-weight:700">panic: content.json not found</p>
              <p style="margin:0;color:var(--fg2)">goroutine 1 [running]:</p>
              <p style="margin:0;color:var(--fg2)"> main.loadPortfolio(0x0, 0x0)</p>
              <p style="margin:0;color:var(--fg2)"> /bd/os/boot.go:42 +0x1f</p>
              <p style="margin:0;color:var(--fg2)" x-text="errDetail"></p>
              <p style="margin:14px 0 0;color:var(--fg)">Le contenu de ce portfolio vit dans un JSON. Le JSON, lui, vit
                sa vie.</p>
              <p style="margin:0;color:var(--fg2)">Deux développeurs sur trois auraient déjà relancé. Le troisième lit
                encore la stack trace.</p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
                <button type="button" data-ctl="retry" @click="load()"
                  style="min-height:44px;padding:0 18px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-family:inherit;font-size:13px;cursor:pointer">retry</button>
                <a href="texte.html"
                  style="min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border:1px solid var(--edge);color:var(--fg2);font-size:13px">version
                  texte</a>
              </div>
            </div>
          </template>
          <template x-if="!dataErr">
            <div aria-hidden="true" style="display:grid;gap:8px">
              <p style="margin:0;color:var(--acc);font-size:16px;font-weight:700;animation:bootLine .3s ease both">bd os
                8.0</p>
              <p style="margin:0;color:var(--fg2);animation:bootLine .3s .18s ease both">initialisation du profil
                benjamin-david…</p>
              <p style="margin:0;color:var(--fg2);animation:bootLine .3s .42s ease both">mount /whoami /parcours /stack
                /impact /formation /contact … <span style="color:var(--ok)">ok</span></p>
              <p style="margin:0;color:var(--fg2);animation:bootLine .3s .68s ease both">fetch missions.json … <span
                  style="color:var(--ok)">4 entrées</span></p>
              <p style="margin:0;color:var(--fg2);animation:bootLine .3s .92s ease both">accessibilité : activée ·
                mesure : <span style="color:var(--ok)">sans cookie</span> · empreinte : minimale</p>
              <p style="margin:0;color:var(--fg2);animation:bootLine .3s 1.14s ease both">réveil de la mascotte … <span
                  style="color:var(--ok)">ok</span></p>
              <p
                style="margin:8px 0 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;animation:bootLine .3s 1.32s ease both">
                <span data-boot-bar aria-hidden="true" style="white-space:pre;color:var(--fg2)">[<span
                    style="color:var(--acc)" x-text="bootBar.filled"></span><span
                    style="color:var(--edge)" x-text="bootBar.hollow"></span>]</span>
                <span style="color:var(--acc)">montage de l'interface<span
                    style="animation:caret 1s steps(1) infinite">_</span></span>
              </p>
            </div>
          </template>
        </div>
      </div>
    </template>

    <footer
      style="flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:0 4px;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden">
      <p style="margin:0;overflow:hidden;text-overflow:ellipsis"><span style="color:var(--acc)">←→</span> volet · <span
          style="color:var(--acc)">↑↓</span> parcourir · <span style="color:var(--acc-text)">j/k</span> section · <span
          style="color:var(--acc)">/</span> saisie · <span style="color:var(--acc-text)">help</span></p>
      <p style="margin:0;display:flex;gap:14px"><a href="texte.html">texte</a><a href="llms.txt">llms.txt</a></p>
    </footer>
  </div>
  <script type="module" src="app.ts"></script>
  <script src="vendor/alpine.js" defer></script>
</body>

</html>
