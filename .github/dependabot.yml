version: 2
updates:
  # Sept jours d'attente : une version tout juste publiée n'a pas encore eu de retour.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Les actions sont épinglées par SHA : sans ce bloc, l'épingle ne bougerait plus.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
