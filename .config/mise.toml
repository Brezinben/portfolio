# Versions exactes, et non « latest » : la seule reproductibilité disponible est celle que
# ce fichier déclare.
[tools]
betterleaks = "1.10.1"
bun = "1.4.4"
hk = "2.12.0"
jactionlint = "2.6.0"
jq = "1.8.2"
node = "26.13.1"
# Le backend aqua ne trouve pas d'archive Linux d'opengrep.
"github:opengrep/opengrep" = "2.0.0"
# jactionlint vérifie les blocs `run:` des workflows avec le shellcheck du PATH.
shellcheck = "0.11.0"
worktrunk = "0.81.0"

[env]
# Les hooks appellent hk par `mise x` : les binaires de node_modules doivent être sur son PATH.
_.path = ["{{config_root}}/node_modules/.bin"]
# hk install écrit alors des hooks qui passent par mise x : les binaires de node_modules gagnent sur les outils globaux.
HK_MISE = "1"
