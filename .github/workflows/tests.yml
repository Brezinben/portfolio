# Deux travaux, et pas un seul : la verification rend la main en une minute, la suite
# navigateur prend sept minutes. Les separer donne le verdict rapide tout de suite, sans
# attendre les navigateurs.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une nouvelle poussee annule la precedente : deux suites navigateur sur la meme branche
# n'apprennent rien de plus, et occupent un runner pour rien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: bun install --frozen-lockfile

      # « artefact-sans-source » lit le dossier construit : sans cette etape il ne trouve
      # rien et echoue. En local la suite navigateur l'avait deja construit.
      - run: bun run build
        env:
          PORTFOLIO_DIST: dist.test

      - run: bun run test

      # Un commit fait avec --no-verify, ou hors d'un agent, n'est passe par aucun hook local.
      - run: bun run check

  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: bun install --frozen-lockfile

      # Les navigateurs pesent plus que les dependances. La cle porte la version de
      # Playwright : une montee de version tire une nouvelle archive, pas l'ancienne.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: navigateurs
        with:
          key: playwright-${{ runner.os }}-1.64.1
          path: ~/.cache/ms-playwright

      - if: steps.navigateurs.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium

      # Les dependances systeme ne sont pas dans le cache du dossier : elles s'installent
      # meme quand les navigateurs en reviennent.
      - if: steps.navigateurs.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium

      # Le plafond de deux workers vient du poste de travail, qui a 7 Go. Le runner en a 16
      # pour quatre coeurs : il en tient quatre, et la suite passe de neuf minutes a cinq.
      - run: bun run test:browser
        env:
          PORTFOLIO_WORKERS: 4

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
