<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>palette de commandes — démonstration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="palette.css">
<style>
body{margin:0;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;-webkit-font-smoothing:antialiased}
.tm{--radius:5px}
.tm,.tm *{box-sizing:border-box}
.tm[data-theme="dark"]{--bg:#1c1d2b;--panel:#242538;--edge:#33344a;--fg:#fff6f6;--fg2:#9b9db8;--acc:#F5B83B;--acc-soft:rgba(245,184,59,.14);--ok:#7fd1b9;--warn:#e2914c}
.tm[data-theme="light"]{--bg:#f3ecec;--panel:#fff6f6;--edge:#ded2d2;--fg:#242538;--fg2:#5a5a70;--acc:#e6a000;--acc-soft:rgba(245,184,59,.22);--ok:#1f7a63;--warn:#a05a12}
.tm[data-theme="noctis"]{--bg:#04252a;--panel:#052c33;--edge:#0d4148;--fg:#d3e5e8;--fg2:#7ea0a6;--acc:#49e9a6;--acc-soft:rgba(73,233,166,.14);--ok:#49e9a6;--warn:#e4b781}
.tm[data-theme="azureus"]{--bg:#061f2c;--panel:#07273b;--edge:#0f3b52;--fg:#cfdce4;--fg2:#7d9bb0;--acc:#49ace9;--acc-soft:rgba(73,172,233,.16);--ok:#5fc9a0;--warn:#e4b781}
.tm[data-theme="uva"]{--bg:#191634;--panel:#211d40;--edge:#332d5c;--fg:#ded9f2;--fg2:#9490bd;--acc:#a29bfe;--acc-soft:rgba(162,155,254,.18);--ok:#6fd3b0;--warn:#e4a06a}
.tm[data-theme="bordo"]{--bg:#23151d;--panel:#2d1b26;--edge:#452a39;--fg:#ecd9e2;--fg2:#a8869a;--acc:#e0728c;--acc-soft:rgba(224,114,140,.18);--ok:#79c9a4;--warn:#e0a35c}
.tm[data-theme="lux"]{--bg:#f2ecdd;--panel:#fdf6e7;--edge:#ddd2ba;--fg:#004d57;--fg2:#4a5952;--acc:#0c6d7a;--acc-soft:rgba(15,125,140,.14);--ok:#1f7a63;--warn:#9a6218}
.tm[data-theme="hibernus"]{--bg:#eaf1f3;--panel:#f7fbfc;--edge:#cfdde1;--fg:#004d57;--fg2:#475e66;--acc:#00707f;--acc-soft:rgba(0,112,127,.13);--ok:#1f7a63;--warn:#9a6218}
</style>
</head>
<body>
<div class="tm" data-theme="dark" id="tm" style="background:var(--bg);color:var(--fg);min-height:100dvh;padding:18px clamp(12px,3vw,28px);font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:12px">

  <div style="flex:1;display:flex;gap:12px;flex-wrap:wrap">
    <nav style="flex:0 1 220px;min-width:180px;border:1px solid var(--edge);background:var(--panel);align-self:flex-start">
      <p style="margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;color:var(--fg2);border-bottom:1px solid var(--edge)">sections</p>
      <ul style="list-style:none;margin:0;padding:5px;display:grid;gap:1px">
        <li style="padding:7px 8px;border-left:2px solid var(--acc);background:var(--acc-soft)">whoami</li>
        <li style="padding:7px 8px;border-left:2px solid transparent;color:var(--fg2)">parcours</li>
        <li style="padding:7px 8px;border-left:2px solid transparent;color:var(--fg2)">stack</li>
        <li style="padding:7px 8px;border-left:2px solid transparent;color:var(--fg2)">contact</li>
      </ul>
    </nav>

    <main style="flex:2 1 420px;min-width:280px;border:1px solid var(--edge);background:var(--panel);display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;padding:9px 16px;border-bottom:1px solid var(--edge);font-size:11px;letter-spacing:.12em;color:var(--fg2)">
        <span>session — bd@portfolio</span><span>⌘K</span>
      </div>
      <div style="padding:16px;display:grid;gap:6px;align-content:start">
        <p style="margin:0;display:grid;grid-template-columns:18px 1fr;gap:10px"><span style="color:var(--acc)">›</span><span style="color:var(--fg2)">bd whoami --verbose</span></p>
        <p style="margin:0;font-size:clamp(26px,3.4vw,40px);line-height:1.05;font-weight:700;letter-spacing:-.03em">Benjamin</p>
        <p style="margin:0 0 8px;font-size:clamp(26px,3.4vw,40px);line-height:1.05;font-weight:700;letter-spacing:-.03em;color:var(--acc)">David</p>
        <p style="margin:0;color:var(--acc);font-weight:700">Concepteur orchestrateur IA · Développeur Full Stack · Nantes</p>
        <div id="log" style="display:grid;gap:4px;margin-top:10px"></div>
      </div>
    </main>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;color:var(--fg2);flex-wrap:wrap">
    <span>Démonstration — palette de commandes &amp; recherche globale</span>
    <button type="button" id="openBtn" style="min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--edge);background:var(--panel);color:var(--fg2);font-family:inherit;font-size:12px;cursor:pointer">
      rechercher <span style="border:1px solid var(--edge);padding:1px 6px;color:var(--fg);white-space:nowrap" id="hot">⌘ K</span>
    </button>
  </div>
</div>

<script src="palette-index.js"></script>
<script src="palette.js"></script>
<script>
(function () {
  const tm = document.getElementById("tm");
  const log = document.getElementById("log");
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  document.getElementById("hot").textContent = isMac ? "⌘ K" : "ctrl K";

  function line(cmd, note, ok) {
    log.innerHTML =
      '<p style="margin:0;display:grid;grid-template-columns:18px 1fr;gap:10px;border-top:1px solid var(--edge);padding-top:10px">' +
      '<span style="color:var(--acc)">›</span><span>' + cmd + "</span></p>" +
      '<p style="margin:0;display:grid;grid-template-columns:18px 1fr;gap:10px">' +
      '<span style="color:var(--' + (ok ? "ok" : "acc") + ')">→</span><span style="color:var(--fg2)">' + note + "</span></p>";
  }

  const palette = commandPalette.create({
    index: paletteIndex.items,
    hotkey: isMac ? "meta" : "ctrl",
    onTheme: function (id, item) {
      tm.dataset.theme = id;
      line(item.cmd, "thème appliqué — " + item.label, true);
    },
    onAction: function (item) {
      if (item.copy && navigator.clipboard) navigator.clipboard.writeText(item.copy).catch(function () {});
      line(item.cmd, "redirection — " + item.label + (item.href ? " (" + item.href + ")" : ""), true);
      // en production : window.location.href = item.href, ou window.open(item.href, item.target)
    },
    onAsk: function (q) { line('ask "' + q + '"', "modèle local du navigateur — à brancher", false); },
    onFind: function (q) { line('find "' + q + '"', "recherche dans la page — à brancher", false); }
  });

  document.getElementById("openBtn").addEventListener("click", function () { palette.open(); });
  line("palette --ready", (isMac ? "⌘K" : "Ctrl+K") + " pour ouvrir la palette", true);
})();
</script>
</body>
</html>
